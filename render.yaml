services:
  - type: web
    name: handspeaks-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn AI_model.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
